[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hands-on-world-models"
version = "0.1.0"
description = "动手学世界模型配套代码"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "Walking Labs" }]
dependencies = []

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "nbclient>=0.10"]
test = []

[tool.setuptools.packages.find]
where = ["src"]
