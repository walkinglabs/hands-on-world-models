<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="900" height="380" fill="#fbf7fb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5568"/>
    </marker>
  </defs>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#4a3548">生成式世界模型流水线：把“预测未来”变成序列生成</text>

  <g font-size="14" text-anchor="middle" font-weight="600">
    <rect x="50" y="110" width="160" height="90" rx="12" fill="#e3edf7" stroke="#4a7fb5" stroke-width="2"/>
    <text x="130" y="148" fill="#2c5a84">视频 VQ 编码器</text>
    <text x="130" y="172" font-size="12" fill="#5c7d9c">画面 → 离散 token</text>

    <rect x="280" y="110" width="180" height="90" rx="12" fill="#e7f0ea" stroke="#3aa675" stroke-width="2"/>
    <text x="370" y="142" fill="#2f6e4f">自回归 Transformer</text>
    <text x="370" y="162" font-size="12" fill="#5a7a68">逐 token 预测</text>
    <text x="370" y="180" font-size="12" fill="#5a7a68">下一帧的未来</text>

    <rect x="530" y="110" width="170" height="90" rx="12" fill="#f3e8f0" stroke="#b0568f" stroke-width="2"/>
    <text x="615" y="142" fill="#7d3b6d">扩散解码器</text>
    <text x="615" y="162" font-size="12" fill="#9c6d8d">token → 逼真像素</text>
    <text x="615" y="180" font-size="12" fill="#9c6d8d">去噪生成画面</text>

    <rect x="760" y="110" width="120" height="90" rx="12" fill="#fdf3e0" stroke="#c9a227" stroke-width="2"/>
    <text x="820" y="142" fill="#8a6116">可控的未来</text>
    <text x="820" y="162" font-size="12" fill="#9a8a56">文字 / 动作 /</text>
    <text x="820" y="180" font-size="12" fill="#9a8a56">单张图驱动</text>
  </g>

  <g stroke="#6b5568" stroke-width="2" fill="none">
    <path d="M 210 155 L 275 155" marker-end="url(#a)"/>
    <path d="M 460 155 L 525 155" marker-end="url(#a)"/>
    <path d="M 700 155 L 755 155" marker-end="url(#a)"/>
  </g>

  <!-- Genie latent action branch -->
  <rect x="280" y="255" width="180" height="70" rx="12" fill="#ffffff" stroke="#3aa675" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="370" y="283" text-anchor="middle" font-size="13" fill="#2f6e4f" font-weight="600">潜在动作模型（Genie）</text>
  <text x="370" y="305" text-anchor="middle" font-size="12" fill="#5a7a68">无动作标注也能学出“谁在控制”</text>
  <path d="M 370 255 L 370 205" stroke="#3aa675" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M 130 205 L 130 290 L 275 290" stroke="#6b5568" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="450" y="365" text-anchor="middle" font-size="13" fill="#6b7280">GAIA-1、Genie、GameNGen 共用的组合拳——生成式世界模型的技术分水岭。</text>
</svg>
