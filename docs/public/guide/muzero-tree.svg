<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="760" height="420" fill="#f7fafc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="380" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3748">MuZero：隐式模型 + 蒙特卡洛树搜索</text>

  <!-- implicit model -->
  <rect x="60" y="90" width="220" height="80" rx="12" fill="#e3edf7" stroke="#4a7fb5" stroke-width="2"/>
  <text x="170" y="120" text-anchor="middle" font-size="14" fill="#2c5a84" font-weight="600">隐式模型</text>
  <text x="170" y="145" text-anchor="middle" font-size="12" fill="#5c7d9c">只预测价值 / 奖励 / 策略</text>
  <text x="170" y="200" text-anchor="middle" font-size="12" fill="#c0564b">✗ 不重建任何观测画面</text>

  <path d="M 280 130 L 360 130" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="320" y="120" font-size="12" fill="#6b7280">展开</text>

  <!-- MCTS tree -->
  <g>
    <circle cx="430" cy="90" r="16" fill="#e7f0ea" stroke="#3aa675" stroke-width="2"/>
    <circle cx="380" cy="170" r="13" fill="#ffffff" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="460" cy="170" r="13" fill="#ffffff" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="530" cy="170" r="13" fill="#ffffff" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="350" cy="240" r="11" fill="#ffffff" stroke="#4a7fb5" stroke-width="1.5"/>
    <circle cx="405" cy="240" r="11" fill="#ffffff" stroke="#4a7fb5" stroke-width="1.5"/>
    <circle cx="490" cy="240" r="11" fill="#ffffff" stroke="#4a7fb5" stroke-width="1.5"/>
    <circle cx="335" cy="305" r="9" fill="#f3e8f0" stroke="#b0568f" stroke-width="1.5"/>
    <circle cx="368" cy="305" r="9" fill="#f3e8f0" stroke="#b0568f" stroke-width="1.5"/>
    <g stroke="#4a5568" stroke-width="1.6" fill="none">
      <path d="M 430 106 L 384 158"/>
      <path d="M 434 105 L 457 158"/>
      <path d="M 443 96 L 521 159"/>
      <path d="M 376 182 L 354 230"/>
      <path d="M 388 182 L 400 230"/>
      <path d="M 470 181 L 487 230"/>
      <path d="M 346 250 L 338 296"/>
      <path d="M 357 250 L 364 296"/>
    </g>
  </g>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#2f6e4f" font-weight="600">搜索树：在模型内模拟未来</text>
  <text x="470" y="330" font-size="12" fill="#7d3b6d">叶节点回传价值</text>

  <!-- chosen action -->
  <path d="M 543 170 L 630 170" stroke="#3aa675" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <rect x="630" y="145" width="100" height="50" rx="10" fill="#e7f0ea" stroke="#3aa675" stroke-width="2"/>
  <text x="680" y="168" text-anchor="middle" font-size="13" fill="#2f6e4f" font-weight="600">执行最佳动作</text>
  <text x="680" y="185" text-anchor="middle" font-size="11" fill="#5a7a68">作用于真实环境</text>

  <text x="380" y="395" text-anchor="middle" font-size="13" fill="#6b7280">模型只需“够用”不必“像世界”：同一套系统打通围棋、将棋与 Atari。</text>
</svg>
