<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="860" height="420" fill="#fdfaf3"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b5d"/>
    </marker>
  </defs>
  <text x="430" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#3d3527">Dyna 架构：真实与想象的双循环</text>

  <!-- boxes -->
  <g font-size="14" text-anchor="middle">
    <rect x="60" y="130" width="150" height="60" rx="10" fill="#e7f0ea" stroke="#3aa675" stroke-width="2"/>
    <text x="135" y="165" fill="#2f6e4f" font-weight="600">真实环境</text>

    <rect x="60" y="260" width="150" height="60" rx="10" fill="#fdf3e0" stroke="#c9a227" stroke-width="2"/>
    <text x="135" y="286" fill="#8a6116" font-weight="600">模型学习</text>
    <text x="135" y="306" font-size="12" fill="#9a8a56">(从真实经验学动态)</text>

    <rect x="350" y="260" width="150" height="60" rx="10" fill="#fdf3e0" stroke="#c9a227" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="425" y="286" fill="#8a6116" font-weight="600">想象经验</text>
    <text x="425" y="306" font-size="12" fill="#9a8a56">(模型生成)</text>

    <rect x="640" y="260" width="150" height="60" rx="10" fill="#e3edf7" stroke="#4a7fb5" stroke-width="2"/>
    <text x="715" y="286" fill="#2c5a84" font-weight="600">策略 / 价值</text>
    <text x="715" y="306" font-size="12" fill="#5c7d9c">(规划与学习)</text>

    <rect x="350" y="130" width="150" height="60" rx="10" fill="#f3e8f0" stroke="#b0568f" stroke-width="2"/>
    <text x="425" y="165" fill="#7d3b6d" font-weight="600">智能体动作</text>
  </g>

  <!-- arrows -->
  <g stroke="#5a6b5d" stroke-width="2" fill="none">
    <path d="M 210 160 L 345 160" marker-end="url(#a)"/>
    <path d="M 500 160 L 635 160" marker-end="url(#a)"/>
    <path d="M 715 255 L 715 200 L 500 175" marker-end="url(#a)"/>
    <path d="M 135 190 L 135 255" marker-end="url(#a)"/>
    <path d="M 210 290 L 345 290" marker-end="url(#a)"/>
    <path d="M 500 290 L 635 290" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#6b7280">
    <text x="275" y="150">观测 + 奖励</text>
    <text x="275" y="280">拟合转移</text>
    <text x="565" y="280">喂给学习器</text>
    <text x="726" y="230">动作</text>
  </g>
  <text x="430" y="395" text-anchor="middle" font-size="13" fill="#6b7280">实线循环：与真实环境交互学习；虚线循环：模型想象出的额外经验，两者共同训练同一个策略。</text>
</svg>
