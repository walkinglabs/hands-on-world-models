<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="880" height="440" fill="#f7fafc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="440" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3748">RSSM：确定性记忆 × 随机不确定性</text>

  <!-- time axis -->
  <g font-size="14" font-weight="600" fill="#4a5568">
    <text x="220" y="80" text-anchor="middle">t</text>
    <text x="440" y="80" text-anchor="middle">t+1</text>
    <text x="660" y="80" text-anchor="middle">t+2</text>
  </g>

  <!-- deterministic path -->
  <g>
    <rect x="160" y="130" width="120" height="46" rx="8" fill="#dbe9f6" stroke="#4a7fb5" stroke-width="2"/>
    <rect x="380" y="130" width="120" height="46" rx="8" fill="#dbe9f6" stroke="#4a7fb5" stroke-width="2"/>
    <rect x="600" y="130" width="120" height="46" rx="8" fill="#dbe9f6" stroke="#4a7fb5" stroke-width="2"/>
  </g>
  <text x="440" y="118" text-anchor="middle" font-size="13" fill="#2c5a84" font-weight="600">确定性 h（GRU 记忆）</text>

  <!-- stochastic nodes -->
  <g>
    <circle cx="220" cy="260" r="26" fill="#e7f0ea" stroke="#3aa675" stroke-width="2"/>
    <circle cx="440" cy="260" r="26" fill="#e7f0ea" stroke="#3aa675" stroke-width="2"/>
    <circle cx="660" cy="260" r="26" fill="#e7f0ea" stroke="#3aa675" stroke-width="2"/>
  </g>
  <text x="440" y="320" text-anchor="middle" font-size="13" fill="#2f6e4f" font-weight="600">随机 z（离散或高斯隐变量）</text>
  <g font-size="14" text-anchor="middle" fill="#2f6e4f">
    <text x="220" y="265">z<tspan baseline-shift="sub" font-size="10">t</tspan></text>
    <text x="440" y="265">z<tspan baseline-shift="sub" font-size="10">t+1</tspan></text>
    <text x="660" y="265">z<tspan baseline-shift="sub" font-size="10">t+2</tspan></text>
  </g>

  <!-- observations/actions -->
  <g text-anchor="middle" font-size="13">
    <rect x="170" y="360" width="100" height="40" rx="8" fill="#f3e8f0" stroke="#b0568f" stroke-width="1.5"/>
    <text x="220" y="385" fill="#7d3b6d">观测 o<tspan baseline-shift="sub" font-size="10">t</tspan></text>
    <rect x="610" y="360" width="100" height="40" rx="8" fill="#fdf3e0" stroke="#c9a227" stroke-width="1.5"/>
    <text x="660" y="385" fill="#8a6116">动作 a<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  </g>

  <!-- arrows -->
  <g stroke="#4a5568" stroke-width="2" fill="none">
    <path d="M 280 153 L 375 153" marker-end="url(#a)"/>
    <path d="M 500 153 L 595 153" marker-end="url(#a)"/>
    <path d="M 246 148 L 400 235" marker-end="url(#a)" opacity="0.6"/>
    <path d="M 466 148 L 620 235" marker-end="url(#a)" opacity="0.6"/>
    <path d="M 220 234 L 220 180" marker-end="url(#a)"/>
    <path d="M 440 234 L 440 180" marker-end="url(#a)"/>
    <path d="M 660 234 L 660 180" marker-end="url(#a)"/>
    <path d="M 220 332 L 220 290" marker-end="url(#a)"/>
    <path d="M 660 358 L 660 290" marker-end="url(#a)"/>
    <path d="M 380 260 L 330 260 L 330 200 L 372 176" marker-end="url(#a)" opacity="0.5"/>
  </g>
  <g font-size="12" fill="#6b7280">
    <text x="327" y="142">记忆传递</text>
    <text x="140" y="215">z 编码进 h</text>
    <text x="230" y="345">编码</text>
    <text x="690" y="345">输入</text>
  </g>
  <text x="440" y="428" text-anchor="middle" font-size="13" fill="#6b7280">蓝色路径保证长程预测稳定，绿色节点吸收世界的不确定性——两者结合是 Dreamer 全系列的骨架。</text>
</svg>
