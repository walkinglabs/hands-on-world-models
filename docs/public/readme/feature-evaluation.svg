<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">用实验评价世界模型</title><desc id="desc">比较一步误差、多步漂移、反事实动作、陌生场景和真实任务。</desc>
  <rect width="720" height="360" rx="28" fill="#eff8fa"/>
  <text x="42" y="56" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#183e48">损失下降了，模型就真的懂了吗？</text>
  <g font-family="system-ui,sans-serif">
    <rect x="42" y="91" width="210" height="216" rx="20" fill="#fff" stroke="#92c1c9" stroke-width="2"/>
    <path d="M72 260 108 229 144 236 180 174 220 146" fill="none" stroke="#2f7d85" stroke-width="5" stroke-linecap="round"/>
    <path d="M72 255H222M72 122V260" stroke="#a8bcc0" stroke-width="2"/>
    <circle cx="220" cy="146" r="7" fill="#e66f3f"/>
    <text x="147" y="289" text-anchor="middle" font-size="17" fill="#526d73">一步分数很好</text>
    <path d="M279 199H331" stroke="#526d73" stroke-width="4"/>
    <rect x="349" y="91" width="329" height="216" rx="20" fill="#fff" stroke="#92c1c9" stroke-width="2"/>
    <g font-size="17" fill="#183e48">
      <circle cx="389" cy="132" r="10" fill="#2f7d85"/><text x="414" y="138">连续走十步会不会跑偏？</text>
      <circle cx="389" cy="177" r="10" fill="#e66f3f"/><text x="414" y="183">换一个动作，未来会不会改变？</text>
      <circle cx="389" cy="222" r="10" fill="#8b67b3"/><text x="414" y="228">陌生场景里还可靠吗？</text>
      <circle cx="389" cy="267" r="10" fill="#d2a62c"/><text x="414" y="273">最后真的让行动变好了吗？</text>
    </g>
  </g>
</svg>
