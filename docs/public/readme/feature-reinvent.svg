<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">从问题重新发明世界模型</title>
  <desc id="desc">机器人在真实行动前比较向左和向右两种可能的未来。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef8f6"/><stop offset="1" stop-color="#fff5eb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#315b61"/></marker>
  </defs>
  <rect width="720" height="360" rx="28" fill="url(#bg)"/>
  <text x="42" y="57" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#173f45">如果先不行动，我们怎样知道会发生什么？</text>
  <rect x="42" y="94" width="176" height="202" rx="20" fill="#fff" stroke="#9bc8c5" stroke-width="2"/>
  <circle cx="130" cy="154" r="34" fill="#e26f40"/><rect x="96" y="188" width="68" height="58" rx="17" fill="#255d64"/>
  <circle cx="116" cy="151" r="5" fill="#fff"/><circle cx="144" cy="151" r="5" fill="#fff"/>
  <path d="M105 256h50M130 246v36" stroke="#255d64" stroke-width="9" stroke-linecap="round"/>
  <text x="130" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#315b61">现在</text>
  <path d="M233 194H309" stroke="#315b61" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="328" y="90" width="342" height="92" rx="18" fill="#fff" stroke="#9bc8c5" stroke-width="2"/>
  <rect x="328" y="208" width="342" height="92" rx="18" fill="#fff" stroke="#f0b58f" stroke-width="2"/>
  <circle cx="380" cy="136" r="21" fill="#e26f40"/><path d="m423 136 34-21v42Z" fill="#2f7d75"/>
  <text x="493" y="129" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#173f45">向左</text><text x="493" y="155" font-family="system-ui,sans-serif" font-size="17" fill="#5b6f72">杯子站稳，盘子没碰倒</text>
  <circle cx="380" cy="254" r="21" fill="#e26f40"/><path d="m423 254 34-21v42Z" fill="#d75c35" transform="rotate(180 440 254)"/>
  <text x="493" y="247" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#173f45">向右</text><text x="493" y="273" font-family="system-ui,sans-serif" font-size="17" fill="#5b6f72">夹爪撞到旁边的盘子</text>
</svg>
