<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">世界模型常用组件</title><desc id="desc">观察依次经过感知、压缩、记忆、预测和决策组件。</desc>
  <rect width="720" height="360" rx="28" fill="#f5f7fb"/>
  <text x="42" y="57" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#20324a">零件放在哪里，比背下名字更重要</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="34" y="119" width="108" height="122" rx="18" fill="#fff" stroke="#91b9d8" stroke-width="2"/><text x="88" y="171" font-size="19" font-weight="700" fill="#20324a">图片</text><text x="88" y="199" font-size="16" fill="#607086">点云</text>
    <path d="M151 180h35" stroke="#71869a" stroke-width="4"/>
    <rect x="195" y="104" width="112" height="152" rx="18" fill="#eaf5ff" stroke="#7db6db" stroke-width="2"/><text x="251" y="158" font-size="19" font-weight="700" fill="#20324a">看</text><text x="251" y="188" font-size="16" fill="#48657d">CNN</text><text x="251" y="214" font-size="16" fill="#48657d">ViT</text>
    <path d="M316 180h35" stroke="#71869a" stroke-width="4"/>
    <rect x="360" y="104" width="112" height="152" rx="18" fill="#eef8f0" stroke="#84b793" stroke-width="2"/><text x="416" y="148" font-size="19" font-weight="700" fill="#20324a">记与想</text><text x="416" y="180" font-size="16" fill="#48657d">GRU</text><text x="416" y="206" font-size="16" fill="#48657d">RSSM</text><text x="416" y="232" font-size="16" fill="#48657d">Transformer</text>
    <path d="M481 180h35" stroke="#71869a" stroke-width="4"/>
    <rect x="525" y="104" width="160" height="152" rx="18" fill="#fff3e9" stroke="#e0a474" stroke-width="2"/><text x="605" y="148" font-size="19" font-weight="700" fill="#20324a">比较与行动</text><text x="605" y="180" font-size="16" fill="#48657d">Value · Actor</text><text x="605" y="206" font-size="16" fill="#48657d">CEM · MCTS</text><text x="605" y="232" font-size="16" fill="#48657d">MPC</text>
  </g>
  <text x="360" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#607086">每个组件都为了解决链条上的一个缺口</text>
</svg>
