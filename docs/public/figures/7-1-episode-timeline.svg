    <text x="50" y="16" text-anchor="middle" class="text-sub" font-weight="600">Âß 2</text>
    <text x="50" y="48" text-anchor="middle" class="text-math">o<tspan font-size="12" dy="4">2</tspan></text>
    <text x="50" y="64" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" fill="#64748b">þÏ + ¶</text>
