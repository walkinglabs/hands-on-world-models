    <text x="372" y="25" font-family="system-ui, sans-serif" font-size="12px" fill="#334155"><tspan font-weight="600">ilû (Physics)</tspan>gL a<tspan font-size="10" dy="2">t</tspan><tspan font-size="12" dy="-2"> ¯ƒó␀' o</tspan><tspan font-size="10" dy="2">t+1</tspan></text>

    <!-- Highlight badge -->
    <rect x="670" y="10" width="145" height="22" rx="11" fill="#fef3c7" stroke="#fde68a"/>
    <text x="742" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11px" font-weight="600" fill="#92400e">T+1 Âß ù” T ¨\</text>
