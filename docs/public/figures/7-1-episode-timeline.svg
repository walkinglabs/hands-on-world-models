    <text x="36" y="25" font-family="system-ui, sans-serif" font-size="12px" fill="#334155"><tspan font-weight="600">Ve³V (Policy À)</tspan>úŽSMÂß o<tspan font-size="10" dy="2">t</tspan><tspan font-size="12" dy="-2"> „K¨\ a</tspan><tspan font-size="10" dy="2">t</tspan></text>

