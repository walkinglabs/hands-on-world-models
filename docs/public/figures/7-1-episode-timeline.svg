    <line x1="140" y1="12" x2="810" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
    <circle cx="140" cy="12" r="3" fill="#64748b"/>
  </g>

  <!-- Step Labels -->
  <g transform="translate(0, 70)">
