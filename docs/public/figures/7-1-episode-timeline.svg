    <text x="275" y="0" text-anchor="middle" class="text-sub" font-weight="600">t = 1</text>
    <text x="455" y="0" text-anchor="middle" class="text-sub" font-weight="600">t = 2</text>
    <text x="590" y="0" text-anchor="middle" class="text-sub" font-weight="600" letter-spacing="3">...</text>
    <text x="725" y="0" text-anchor="middle" class="text-sub" font-weight="600">t = T</text>
  </g>

