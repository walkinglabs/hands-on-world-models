<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .text-math { font-family: "SF Pro Display", -apple-system, "Times New Roman", serif; font-style: italic; font-size: 16px; font-weight: 600; fill: #0f172a; }
      .text-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #25636a; }
      .text-action { font-family: "SF Pro Display", -apple-system, serif; font-style: italic; font-size: 15px; font-weight: 600; fill: #ffffff; }
      .line-main { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
      .line-dash { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4 4; }
      .arrow { fill: #25636a; }
    </style>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#25636a"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
